<title>Château de sable</title>
<style>
  :root {
    --ink: #1a1410;
    --paper: #f3ece0;
    --line: rgba(26,20,16,.14);
    --accent: #c2693a;
    --dark: rgba(18,12,8,.92);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0d1418; }
  canvas { display: block; }

  /* ---- floating controls (over the sky) ---- */
  #brand {
    position: fixed; top: 12px; left: 14px; z-index: 200;
    font: 13px/1 ui-monospace, "SF Mono", monospace; font-weight: 700;
    letter-spacing: .1em; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.4);
    pointer-events: none; user-select: none;
  }
  #topControls {
    position: fixed; top: 8px; right: 8px; z-index: 200; display: flex; gap: 6px;
  }
  #zoomControls {
    position: fixed; right: 8px; top: 50%; transform: translateY(-50%);
    z-index: 200; display: flex; flex-direction: column; gap: 6px;
  }
  #tideBtn {
    position: fixed; right: 8px; bottom: 86px; z-index: 200;
  }
  .floatBtn {
    min-width: 40px; height: 40px; padding: 0 12px; cursor: pointer;
    font: 13px/1 ui-monospace, monospace; color: #fff;
    background: rgba(18,12,8,.40); border: 1px solid rgba(255,255,255,.22);
    border-radius: 10px; backdrop-filter: blur(6px);
    display: inline-flex; align-items: center; justify-content: center;
    white-space: nowrap; user-select: none;
  }
  .floatBtn:hover { background: rgba(18,12,8,.58); }
  .floatBtn.on { background: var(--accent); border-color: var(--accent); }
  #zoomControls .floatBtn { width: 40px; padding: 0; font-size: 22px; }

  /* ---- settings panel ---- */
  #ui {
    position: fixed; top: 56px; left: 8px; z-index: 150; display: none;
    width: 250px; max-height: calc(100vh - 135px); overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    font: 12px/1.4 ui-monospace, "SF Mono", monospace;
    color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px 12px;
    box-shadow: 6px 6px 24px rgba(0,0,0,.45);
  }
  #ui.open { display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 5px 0; }
  .row label { font-size: 11px; opacity: .8; }
  .row .val { font-size: 11px; font-variant-numeric: tabular-nums; opacity: .55; min-width: 32px; text-align: right; }
  input[type=range] { width: 100px; accent-color: var(--accent); }
  .btns { display: flex; gap: 5px; margin-top: 9px; }
  .btns button {
    flex: 1; font: 11px/1 ui-monospace, monospace; cursor: pointer;
    padding: 6px 4px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink);
  }
  .btns button:hover { border-color: var(--accent); color: var(--accent); }
  .btns button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  .help { font-size: 10px; opacity: .55; line-height: 1.6; }
  .help b { opacity: .9; }

  /* ---- bottom toolbar ---- */
  #toolbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    display: flex; flex-direction: column; gap: 5px;
    padding: 6px 8px max(8px, env(safe-area-inset-bottom));
    background: var(--dark); backdrop-filter: blur(8px);
    border-top: 1px solid rgba(255,255,255,.07);
  }
  #modeBtns { display: flex; gap: 5px; }
  .modeBtn {
    flex: 1; padding: 6px; cursor: pointer;
    font: 11px/1 ui-monospace, monospace;
    border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
    background: rgba(255,255,255,.06); color: #f3ece0;
  }
  .modeBtn:hover { background: rgba(255,255,255,.12); }
  .modeBtn.on { background: var(--accent); border-color: var(--accent); }
  #toolBtns { display: none; flex-wrap: wrap; gap: 4px; }
  #toolBtns.visible { display: flex; }
  .toolBtn {
    flex: 1; min-width: 46px; padding: 6px 2px; cursor: pointer;
    font: 10px/1 ui-monospace, monospace;
    border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
    background: rgba(255,255,255,.06); color: #f3ece0; white-space: nowrap;
  }
  .toolBtn:hover { border-color: var(--accent); color: var(--accent); }
  .toolBtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>

<body>

<!-- floating controls over the sky -->
<div id="brand">Château de sable</div>
<div id="topControls">
  <button class="floatBtn" id="langBtn">EN</button>
  <button class="floatBtn" id="settingsBtn">⚙</button>
</div>
<div id="zoomControls">
  <button class="floatBtn" id="zoomInBtn" aria-label="zoom avant">+</button>
  <button class="floatBtn" id="zoomOutBtn" aria-label="zoom arrière">−</button>
</div>
<button class="floatBtn" id="tideBtn">Marée montante</button>

<!-- collapsible settings panel -->
<div id="ui">
  <div class="row">
    <label id="labelBrush">Pinceau</label>
    <input id="brushSize" type="range" min="0.01" max="0.12" step="0.005" value="0.04">
    <span class="val" id="brushSizeV"></span>
  </div>
  <div class="row">
    <label id="labelPower">Force</label>
    <input id="brushPow" type="range" min="0.05" max="1.0" step="0.05" value="0.4">
    <span class="val" id="brushPowV"></span>
  </div>
  <div class="row">
    <label id="labelCohesion">Cohésion</label>
    <input id="repose" type="range" min="0.08" max="1.2" step="0.02" value="0.5">
    <span class="val" id="reposeV"></span>
  </div>
  <hr>
  <div class="row">
    <label id="labelTide">Marée</label>
    <input id="tide" type="range" min="-2" max="18" step="0.2" value="-1">
    <span class="val" id="tideV"></span>
  </div>
  <div class="row">
    <label id="labelErosion">Érosion</label>
    <input id="erode" type="range" min="0" max="2" step="0.05" value="0.7">
    <span class="val" id="erodeV"></span>
  </div>
  <div class="row">
    <label id="labelWaves">Vagues</label>
    <input id="wave" type="range" min="0" max="3" step="0.1" value="0.9">
    <span class="val" id="waveV"></span>
  </div>
  <div class="row">
    <label id="labelRate">Cadence</label>
    <input id="cad" type="range" min="0.3" max="3" step="0.1" value="1.5">
    <span class="val" id="cadV"></span>
  </div>
  <div class="btns">
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Réinitialiser</button>
  </div>
  <hr>
  <p class="help" id="helpText">
    <b>Mode construire</b> : tracé libre (+ / −) ou outils<br>
    <b>Mode déplacer</b> : tourne · zoome · pan
  </p>
</div>

<!-- bottom toolbar -->
<div id="toolbar">
  <div id="modeBtns">
    <button id="navBtn" class="modeBtn on">🧭 Déplacer</button>
    <button id="buildBtn" class="modeBtn">🔨 Construire</button>
  </div>
  <div id="toolBtns">
    <button id="towerBtn" class="toolBtn">Tour</button>
    <button id="wallBtn" class="toolBtn">Muraille</button>
    <button id="fosseBtn" class="toolBtn">Fossé</button>
    <button id="addBtn" class="toolBtn">+ Sable</button>
    <button id="digBtn" class="toolBtn">− Sable</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- config ----------
const GRID = 256;
const WORLD = 100;
const HSCALE = 1.0;

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d1418, 1);
document.body.appendChild(renderer.domElement);

const gl = renderer.getContext();
const canFloat = renderer.capabilities.isWebGL2 && gl.getExtension('EXT_color_buffer_float');
const RT_TYPE = canFloat ? THREE.FloatType : THREE.HalfFloatType;
const canLinear = gl.getExtension('OES_texture_float_linear');
const RT_FILTER = canLinear ? THREE.LinearFilter : THREE.NearestFilter;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 62, 86);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.minDistance = 28;
controls.maxDistance = 260;

// ---------- ciel ----------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    uTop: { value: new THREE.Color(0x1fa6e0) },
    uHor: { value: new THREE.Color(0xfceac6) },
  },
  vertexShader: `varying vec3 vDir;
    void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `precision highp float; varying vec3 vDir; uniform vec3 uTop, uHor;
    void main(){
      float h = clamp(normalize(vDir).y * 0.5 + 0.5, 0.0, 1.0);
      gl_FragColor = vec4(mix(uHor, uTop, smoothstep(0.45, 0.95, h)), 1.0);
    }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), skyMat));

// ---------- ping-pong render targets ----------
function makeRT() {
  return new THREE.WebGLRenderTarget(GRID, GRID, {
    type: RT_TYPE, format: THREE.RGBAFormat,
    minFilter: RT_FILTER, magFilter: RT_FILTER,
    wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false, stencilBuffer: false,
  });
}
let rtA = makeRT(), rtB = makeRT();
let fluxA = makeRT(), fluxB = makeRT();
renderer.setClearColor(0x000000, 0);
for (const rt of [fluxA, fluxB]) { renderer.setRenderTarget(rt); renderer.clear(); }
renderer.setRenderTarget(null);
renderer.setClearColor(0x0d1418, 1);

const simScene = new THREE.Scene();
const simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const simQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
simScene.add(simQuad);

const fsVert = /* glsl */`
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

// --- init shader ---
const initMat = new THREE.ShaderMaterial({
  vertexShader: fsVert,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
      vec2 u = f*f*(3.-2.*f);
      return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
    }
    void main(){
      float beach = smoothstep(0.05, 0.95, vUv.y) * 14.0;
      float n = (noise(vUv * 5.0) - 0.5) * 0.5;
      float h = max(0.0, beach + n);
      gl_FragColor = vec4(h, 0.0, 0.0, 1.0);
    }
  `,
});

const WAVE_GLSL = `
  float waveDisp(vec2 pos, float depth){
    float shoal = 1.0 - smoothstep(0.6, 7.0, depth);
    float brk   = smoothstep(0.0, 0.8, depth);
    float a = uWaveAmp * (0.45 + 1.3 * shoal) * brk;
    float t = uTime * uWaveSpeed;
    return a * 0.60 * sin(dot(pos, vec2( 0.00, -0.45)) - t * 2.0)
         + a * 0.40 * sin(dot(pos, vec2( 0.18, -0.55)) - t * 2.6 + 1.7)
         + a * 0.25 * sin(dot(pos, vec2(-0.12, -0.70)) - t * 3.3 + 3.0);
  }
  float fhash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float fnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    float a = fhash(i), b = fhash(i + vec2(1.0, 0.0)),
          c = fhash(i + vec2(0.0, 1.0)), dd = fhash(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(a, b, u.x), mix(c, dd, u.x), u.y);
  }
  float distSeg(vec2 p, vec2 a, vec2 b){
    vec2 pa = p - a, ba = b - a;
    float t = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
    return length(pa - ba * t);
  }
`;

// --- simulation shader ---
const simMat = new THREE.ShaderMaterial({
  uniforms: {
    uPrev:     { value: null },
    uHeight:   { value: null },
    uTexel:    { value: 1.0 / GRID },
    uBrush:    { value: new THREE.Vector2(-1, -1) },
    uBrushR:   { value: 0.04 },
    uBrushP:   { value: 0.0 },
    uStampMode:{ value: 0.0 },
    uStampA:   { value: new THREE.Vector2(0, 0) },
    uStampB:   { value: new THREE.Vector2(0, 0) },
    uStampRt:  { value: 0.025 },
    uStampRb:  { value: 0.045 },
    uStampH:   { value: 0.0 },
    uRepose:   { value: 0.5 },
    uErode:    { value: 0.7 },
    uDt:       { value: 1.0 },
    uHScale:   { value: HSCALE },
    uWorld:    { value: WORLD },
    uTideMean: { value: -1.0 },
    uWaveAmp:  { value: 0.9 },
    uWaveSpeed:{ value: 1.5 },
    uTime:     { value: 0.0 },
  },
  vertexShader: fsVert,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uPrev, uHeight;
    uniform float uTexel, uBrushR, uBrushP, uRepose, uErode, uDt;
    uniform float uHScale, uWorld, uTideMean, uWaveAmp, uWaveSpeed, uTime;
    uniform float uStampMode, uStampRt, uStampRb, uStampH;
    uniform vec2 uBrush, uStampA, uStampB;
    ${WAVE_GLSL}
    void main(){
      vec4 st = texture2D(uPrev, vUv);
      float h0 = st.r, s0 = st.g;
      float d  = st.b;
      float h = h0, s = s0;

      if (uBrushP != 0.0) {
        float dd = distance(vUv, uBrush);
        float b = smoothstep(uBrushR, 0.0, dd);
        h += b * uBrushP * uDt;
      }

      if (uStampMode > 0.5) {
        float dd = (uStampMode < 1.5) ? distance(vUv, uStampA) : distSeg(vUv, uStampA, uStampB);
        float target = (dd < uStampRt) ? uStampH
                     : (dd < uStampRb) ? uStampH * (uStampRb - dd) / max(uStampRb - uStampRt, 1e-4)
                     : -1e9;
        h = max(h, target);
      }

      vec2 e = vec2(uTexel, 0.0);
      vec4 nL = texture2D(uPrev, vUv - e.xy);
      vec4 nR = texture2D(uPrev, vUv + e.xy);
      vec4 nD = texture2D(uPrev, vUv - e.yx);
      vec4 nU = texture2D(uPrev, vUv + e.yx);
      float hL = nL.r, hR = nR.r, hD = nD.r, hU = nU.r;
      float dL = nL.b, dR = nR.b, dD = nD.b, dU = nU.b;
      vec4 cLD = texture2D(uPrev, vUv + vec2(-uTexel, -uTexel));
      vec4 cRD = texture2D(uPrev, vUv + vec2( uTexel, -uTexel));
      vec4 cLU = texture2D(uPrev, vUv + vec2(-uTexel,  uTexel));
      vec4 cRU = texture2D(uPrev, vUv + vec2( uTexel,  uTexel));

      float subL = smoothstep(0.05, 1.2, 0.5 * (d + dL));
      float subR = smoothstep(0.05, 1.2, 0.5 * (d + dR));
      float subD = smoothstep(0.05, 1.2, 0.5 * (d + dD));
      float subU = smoothstep(0.05, 1.2, 0.5 * (d + dU));
      float TaL = mix(uRepose, max(uRepose * 0.2, 0.08), subL);
      float TaR = mix(uRepose, max(uRepose * 0.2, 0.08), subR);
      float TaD = mix(uRepose, max(uRepose * 0.2, 0.08), subD);
      float TaU = mix(uRepose, max(uRepose * 0.2, 0.08), subU);
      float subLD = smoothstep(0.05, 1.2, 0.5 * (d + cLD.b));
      float subRD = smoothstep(0.05, 1.2, 0.5 * (d + cRD.b));
      float subLU = smoothstep(0.05, 1.2, 0.5 * (d + cLU.b));
      float subRU = smoothstep(0.05, 1.2, 0.5 * (d + cRU.b));
      float TdLD = mix(uRepose, max(uRepose * 0.2, 0.08), subLD) * 1.4142;
      float TdRD = mix(uRepose, max(uRepose * 0.2, 0.08), subRD) * 1.4142;
      float TdLU = mix(uRepose, max(uRepose * 0.2, 0.08), subLU) * 1.4142;
      float TdRU = mix(uRepose, max(uRepose * 0.2, 0.08), subRU) * 1.4142;
      float delta = 0.0, a0;
      a0 = h0-hL;    delta += (a0> TaL)?-(a0-TaL):((-a0>TaL)?(-a0-TaL):0.0);
      a0 = h0-hR;    delta += (a0> TaR)?-(a0-TaR):((-a0>TaR)?(-a0-TaR):0.0);
      a0 = h0-hD;    delta += (a0> TaD)?-(a0-TaD):((-a0>TaD)?(-a0-TaD):0.0);
      a0 = h0-hU;    delta += (a0> TaU)?-(a0-TaU):((-a0>TaU)?(-a0-TaU):0.0);
      a0 = h0-cLD.r; delta += 0.7071*((a0> TdLD)?-(a0-TdLD):((-a0>TdLD)?(-a0-TdLD):0.0));
      a0 = h0-cRD.r; delta += 0.7071*((a0> TdRD)?-(a0-TdRD):((-a0>TdRD)?(-a0-TdRD):0.0));
      a0 = h0-cLU.r; delta += 0.7071*((a0> TdLU)?-(a0-TdLU):((-a0>TdLU)?(-a0-TdLU):0.0));
      a0 = h0-cRU.r; delta += 0.7071*((a0> TdRU)?-(a0-TdRU):((-a0>TdRU)?(-a0-TdRU):0.0));
      h += delta * 0.14;

      h += 0.03 * ( subL*(hL-h0) + subR*(hR-h0) + subD*(hD-h0) + subU*(hU-h0) );

      if (d > 0.05) {
        float subE = smoothstep(0.05, 0.4, d) * (1.0 - smoothstep(2.5, 7.0, d));
        vec2 wpos = vec2((vUv.x - 0.5) * uWorld, (0.5 - vUv.y) * uWorld);
        float surf = waveDisp(wpos, d);
        float energy = 0.85 + 0.3 * clamp(surf, 0.0, 1.0);
        vec2 grad = vec2(hL - hR, hU - hD);
        float slope = length(grad);
        vec2 nH = grad / max(slope, 1e-4);
        float expo   = max(0.0, dot(nH, vec2(0.0, 1.0)));
        float impact = expo * smoothstep(0.4, 1.0, slope);
        float rate = 0.4 + 0.6 * impact;
        float detach = min(uErode * subE * energy * rate * uDt * 0.35, h);
        h -= detach; s += detach; d += detach;
      }

      float sL = nL.g, sR = nR.g, sD = nD.g, sU = nU.g;
      float T = 0.04;
      float sFlux = 0.0;
      sFlux += (h0 - hL > 0.0) ? -T * s0 * min(h0 - hL, 2.0) : T * sL * min(hL - h0, 2.0);
      sFlux += (h0 - hR > 0.0) ? -T * s0 * min(h0 - hR, 2.0) : T * sR * min(hR - h0, 2.0);
      sFlux += (h0 - hD > 0.0) ? -T * s0 * min(h0 - hD, 2.0) : T * sD * min(hD - h0, 2.0);
      sFlux += (h0 - hU > 0.0) ? -T * s0 * min(h0 - hU, 2.0) : T * sU * min(hU - h0, 2.0);
      s = max(s + sFlux, 0.0);

      float dep = s * clamp(0.10 * uDt, 0.0, 1.0);
      if (d >= 0.05) dep = min(dep, max(d - 0.1, 0.0));
      dep = min(dep, s);
      s -= dep; h += dep; d = max(d - dep, 0.0);

      h = max(h, 0.0);
      s = clamp(s, 0.0, 5.0);
      gl_FragColor = vec4(h, s, d, st.a);
    }
  `,
});

// --- flux shader ---
const fluxMat = new THREE.ShaderMaterial({
  uniforms: {
    uState: { value: null }, uFlux: { value: null },
    uTexel: { value: 1.0 / GRID }, uHScale: { value: HSCALE },
    uDt: { value: 1.0 }, uFlowK: { value: 0.15 },
  },
  vertexShader: fsVert,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uState, uFlux;
    uniform float uTexel, uHScale, uDt, uFlowK;
    void main(){
      vec4 c = texture2D(uState, vUv);
      float H = c.r * uHScale + c.b;
      vec4 f = texture2D(uFlux, vUv);
      vec2 e = vec2(uTexel, 0.0);
      vec4 cL = texture2D(uState, vUv - e.xy);
      vec4 cR = texture2D(uState, vUv + e.xy);
      vec4 cU = texture2D(uState, vUv + e.yx);
      vec4 cD = texture2D(uState, vUv - e.yx);
      float HL = cL.r*uHScale + cL.b, HR = cR.r*uHScale + cR.b;
      float HU = cU.r*uHScale + cU.b, HD = cD.r*uHScale + cD.b;
      float K = uFlowK * uDt, damp = 0.90;
      float fL = max(0.0, f.r*damp + K*(H - HL));
      float fR = max(0.0, f.g*damp + K*(H - HR));
      float fU = max(0.0, f.b*damp + K*(H - HU));
      float fD = max(0.0, f.a*damp + K*(H - HD));
      float outflow = (fL + fR + fU + fD) * uDt;
      float scale = (outflow > 1e-6) ? min(1.0, c.b / outflow) : 1.0;
      gl_FragColor = vec4(fL, fR, fU, fD) * scale;
    }
  `,
});

// --- water update shader ---
const waterUpMat = new THREE.ShaderMaterial({
  uniforms: {
    uState: { value: null }, uFlux: { value: null },
    uTexel: { value: 1.0 / GRID }, uHScale: { value: HSCALE },
    uDt: { value: 1.0 }, uTideMean: { value: -1.0 },
    uWorld: { value: WORLD }, uTime: { value: 0.0 },
    uWaveAmp: { value: 0.6 }, uWaveSpeed: { value: 1.0 },
  },
  vertexShader: fsVert,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uState, uFlux;
    uniform float uTexel, uHScale, uDt, uTideMean;
    uniform float uWorld, uTime, uWaveAmp, uWaveSpeed;
    ${WAVE_GLSL}
    void main(){
      vec4 c = texture2D(uState, vUv);
      vec4 f = texture2D(uFlux, vUv);
      float outflow = f.r + f.g + f.b + f.a;
      vec2 e = vec2(uTexel, 0.0);
      float inL = texture2D(uFlux, vUv - e.xy).g;
      float inR = texture2D(uFlux, vUv + e.xy).r;
      float inU = texture2D(uFlux, vUv + e.yx).a;
      float inD = texture2D(uFlux, vUv - e.yx).b;
      float d = c.b + uDt * (inL + inR + inU + inD - outflow);
      d = clamp(d, 0.0, 60.0);
      float bed = c.r * uHScale;
      float openSea = smoothstep(0.5, 2.5, d);
      d += (uTideMean - (bed + d)) * 0.08 * openSea * uDt;
      d = max(d, 0.0);
      if (vUv.y < uTexel * 2.0) d = max(0.0, uTideMean - bed);
      gl_FragColor = vec4(c.r, c.g, d, c.a);
    }
  `,
});

// --- stamp shader (pure geometry, no physics) ---
const stampMat = new THREE.ShaderMaterial({
  uniforms: {
    uPrev:      { value: null },
    uStampMode: { value: 0.0 },
    uStampA:    { value: new THREE.Vector2(0, 0) },
    uStampB:    { value: new THREE.Vector2(0, 0) },
    uStampRt:   { value: 0.025 },
    uStampRb:   { value: 0.045 },
    uStampH:    { value: 0.0 },
    uStampBase: { value: 0.0 },
    uStampDig:  { value: 0.0 },
  },
  vertexShader: fsVert,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uPrev;
    uniform float uStampMode, uStampRt, uStampRb, uStampH, uStampBase, uStampDig;
    uniform vec2 uStampA, uStampB;
    float distSeg(vec2 p, vec2 a, vec2 b){
      vec2 pa = p - a, ba = b - a;
      float t = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
      return length(pa - ba * t);
    }
    void main(){
      vec4 st = texture2D(uPrev, vUv);
      float h = st.r;
      float dd = (uStampMode < 1.5) ? distance(vUv, uStampA) : distSeg(vUv, uStampA, uStampB);
      float profile = (dd < uStampRt) ? 1.0
                    : (dd < uStampRb) ? (uStampRb - dd) / max(uStampRb - uStampRt, 1e-4)
                    : 0.0;
      if (profile > 0.0) {
        if (uStampDig > 0.5) {
          float target = uStampBase - (uStampBase - uStampH) * profile;
          h = min(h, target);
        } else {
          float target = uStampH * profile;
          h = max(h, target);
        }
      }
      h = max(h, 0.0);
      gl_FragColor = vec4(h, st.g, st.b, st.a);
    }
  `,
});

function renderTo(mat, target) {
  simQuad.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(simScene, simCam);
  renderer.setRenderTarget(null);
}
simQuad.material = initMat;
renderer.setRenderTarget(rtA);
renderer.render(simScene, simCam);
renderer.setRenderTarget(null);

// ---------- sand mesh ----------
const sandGeo = new THREE.PlaneGeometry(WORLD, WORLD, GRID, GRID);
sandGeo.rotateX(-Math.PI / 2);
const sandMat = new THREE.ShaderMaterial({
  uniforms: {
    uHeight: { value: rtA.texture },
    uTexel:  { value: 1.0 / GRID },
    uHScale: { value: HSCALE },
    uCell:   { value: WORLD / GRID },
    uTideMean: { value: -1.0 },
  },
  vertexShader: /* glsl */`
    uniform sampler2D uHeight; uniform float uHScale;
    varying vec2 vUv; varying float vY;
    void main(){
      vUv = uv;
      vec3 p = position;
      float h = texture2D(uHeight, uv).r * uHScale;
      p.y += h; vY = p.y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D uHeight; uniform float uTexel, uHScale, uCell, uTideMean;
    varying vec2 vUv; varying float vY;
    float sandHash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    // scattered soft pebble dots: only ~1/5 of cells hold a randomly placed dot
    float speckle(vec2 uv){
      vec2 p = uv * 190.0;
      vec2 g = floor(p), f = fract(p);
      vec2 dp = vec2(sandHash(g + 3.7), sandHash(g + 8.3));   // random dot centre in cell
      float present = step(0.78, sandHash(g));
      return present * (1.0 - smoothstep(0.05, 0.17, distance(f, dp)));
    }
    void main(){
      vec2 e = vec2(uTexel, 0.0);
      float hL = texture2D(uHeight, vUv - e.xy).r;
      float hR = texture2D(uHeight, vUv + e.xy).r;
      float hD = texture2D(uHeight, vUv - e.yx).r;
      float hU = texture2D(uHeight, vUv + e.yx).r;
      vec3 n = normalize(vec3((hL - hR) * uHScale, 2.0 * uCell, (hD - hU) * uHScale));
      vec3 L = normalize(vec3(0.4, 0.9, 0.25));
      float diff = max(dot(n, L), 0.0);
      float wet = smoothstep(uTideMean + 0.5, uTideMean - 2.5, vY);
      vec3 dry = vec3(0.98, 0.87, 0.60);
      vec3 wetc = vec3(0.64, 0.48, 0.30);
      vec3 base = mix(dry, wetc, wet);
      vec3 col = base * (0.45 + 0.60 * diff);
      float sp = speckle(vUv) * (1.0 - wet);        // pebbles on dry sand only
      col = mix(col, col * vec3(0.60, 0.52, 0.42), sp * 0.55);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
scene.add(new THREE.Mesh(sandGeo, sandMat));

// ---------- water mesh ----------
const waterGeo = new THREE.PlaneGeometry(WORLD, WORLD, GRID, GRID);
waterGeo.rotateX(-Math.PI / 2);
const waterMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
  uniforms: {
    uHeight:   { value: rtA.texture },
    uHScale:   { value: HSCALE },
    uWorld:    { value: WORLD },
    uTideMean: { value: -1.0 },
    uWaveAmp:  { value: 0.9 },
    uWaveSpeed:{ value: 1.5 },
    uTime:     { value: 0.0 },
  },
  vertexShader: /* glsl */`
    uniform sampler2D uHeight;
    uniform float uHScale, uWaveAmp, uWaveSpeed, uTime, uTideMean;
    varying vec2 vUv; varying vec2 vWorld; varying float vDepth;
    ${WAVE_GLSL}
    void main(){
      vUv = uv;
      vec3 p = position;
      vWorld = p.xz;
      vec4 c = texture2D(uHeight, uv);
      float bed = c.r * uHScale;
      float d = c.b;
      float T = ${(1.0 / GRID).toFixed(6)};
      float prox = d;
      prox = max(prox, texture2D(uHeight, uv + vec2( 0.0, -3.0*T)).b);
      prox = max(prox, texture2D(uHeight, uv + vec2( 0.0, -6.0*T)).b);
      prox = max(prox, texture2D(uHeight, uv + vec2( 0.0,  3.0*T)).b);
      prox = max(prox, texture2D(uHeight, uv + vec2( 3.0*T, 0.0)).b);
      prox = max(prox, texture2D(uHeight, uv + vec2(-3.0*T, 0.0)).b);
      prox = max(prox, texture2D(uHeight, uv + vec2( 6.0*T, 0.0)).b);
      prox = max(prox, texture2D(uHeight, uv + vec2(-6.0*T, 0.0)).b);
      float pw = smoothstep(0.15, 0.5, prox);
      float lvl = uTideMean + waveDisp(p.xz, 0.9) * 1.5;
      float film = clamp((lvl - bed) * 0.6, 0.0, 0.22) * pw;
      float dEff = max(d, film);
      vDepth = dEff;
      p.y = max(bed + dEff + waveDisp(p.xz, dEff), bed);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D uHeight;
    uniform float uHScale, uWorld, uWaveAmp, uWaveSpeed, uTime;
    varying vec2 vUv; varying vec2 vWorld; varying float vDepth;
    ${WAVE_GLSL}
    void main(){
      vec4 c = texture2D(uHeight, vUv);
      float d = vDepth;
      if (d < 0.015) discard;
      float edge = smoothstep(0.015, 0.6, d);
      float surf = c.r * uHScale + d + waveDisp(vWorld, d);
      float epsW = 0.7, epsU = 0.7 / uWorld;
      vec4 cX = texture2D(uHeight, vUv + vec2(epsU, 0.0));
      vec4 cZ = texture2D(uHeight, vUv + vec2(0.0, -epsU));
      float sX = cX.r*uHScale + cX.b + waveDisp(vWorld + vec2(epsW, 0.0), cX.b);
      float sZ = cZ.r*uHScale + cZ.b + waveDisp(vWorld + vec2(0.0, epsW), cZ.b);
      vec3 nrm = normalize(vec3(surf - sX, epsW, surf - sZ));
      vec3 L = normalize(vec3(0.4, 0.9, 0.25));
      float diff = max(dot(nrm, L), 0.0);
      float fres = pow(1.0 - max(nrm.y, 0.0), 3.0);
      float shore = smoothstep(1.6, 0.0, d);
      vec2 fc = vWorld * 0.16 + vec2(0.0, uTime * 1.1);
      float fn = 0.6 * fnoise(fc) + 0.4 * fnoise(fc * 2.3 + 7.0);
      float streak = smoothstep(0.45, 0.85, fn + shore * 0.25);
      float crest = smoothstep(0.25, 0.6, 1.0 - nrm.y);
      float foam = clamp(shore * (0.4 + 0.8 * streak) + crest * 0.25, 0.0, 1.0);
      vec3 shallow = vec3(0.20, 0.82, 0.78);
      vec3 deep    = vec3(0.02, 0.42, 0.60);
      vec3 col = mix(shallow, deep, clamp(d / 8.0, 0.0, 1.0));
      col += diff * 0.16;
      col = mix(col, vec3(0.75, 0.93, 0.95), fres * 0.5);
      col = mix(col, vec3(1.0), foam * 0.8);
      float a = clamp(d * 0.6 + 0.3, 0.3, 0.92) * edge;
      a = max(a, foam * edge * 0.9);
      gl_FragColor = vec4(col, a);
    }
  `,
});
scene.add(new THREE.Mesh(waterGeo, waterMat));

// ---------- interaction ----------
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ndc = new THREE.Vector2();
const hit = new THREE.Vector3();
const readBuf = new Float32Array(4);
const activePointers = new Set();
let painting = false, lastPointer = null;
let tool = 'paint', wallActive = false, wallPoints = [], pendingTower = null;

const previewCanvas = document.createElement('canvas');
previewCanvas.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;';
previewCanvas.width = innerWidth; previewCanvas.height = innerHeight;
document.body.appendChild(previewCanvas);
const previewCtx = previewCanvas.getContext('2d');

function clearPreview() { previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height); }

function drawPreview(pts) {
  clearPreview();
  if (pts.length < 2) return;
  previewCtx.save();
  previewCtx.strokeStyle = 'rgba(255,220,120,0.85)';
  previewCtx.lineWidth = 3;
  previewCtx.lineJoin = 'round';
  previewCtx.lineCap = 'round';
  previewCtx.setLineDash([6, 5]);
  previewCtx.beginPath();
  previewCtx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) previewCtx.lineTo(pts[i].x, pts[i].y);
  previewCtx.stroke();
  previewCtx.restore();
}

function chaikin(pts, iterations = 3) {
  let p = pts;
  for (let k = 0; k < iterations; k++) {
    const n = [p[0]];
    for (let i = 0; i < p.length - 1; i++) {
      n.push([p[i][0] * 0.75 + p[i+1][0] * 0.25, p[i][1] * 0.75 + p[i+1][1] * 0.25]);
      n.push([p[i][0] * 0.25 + p[i+1][0] * 0.75, p[i][1] * 0.25 + p[i+1][1] * 0.75]);
    }
    n.push(p[p.length - 1]);
    p = n;
  }
  return p;
}

function buildPathFromPoints(screenPts, cfg, dig) {
  if (screenPts.length < 2) return;
  const uvPts = screenPts.map(p => surfaceUvFromPointer(p.x, p.y)).filter(Boolean);
  if (uvPts.length < 2) return;
  const smoothed = chaikin(uvPts, 3);
  const MIN_DIST = 0.003;
  const filtered = [smoothed[0]];
  for (let i = 1; i < smoothed.length; i++) {
    const prev = filtered[filtered.length - 1];
    const dx = smoothed[i][0] - prev[0], dy = smoothed[i][1] - prev[1];
    if (Math.sqrt(dx*dx + dy*dy) >= MIN_DIST) filtered.push(smoothed[i]);
  }
  const baseHeights = filtered.map(pt => heightAtUv(pt[0], pt[1]));
  stampMat.uniforms.uStampMode.value = 2;
  stampMat.uniforms.uStampRt.value = cfg.rt;
  stampMat.uniforms.uStampRb.value = cfg.rb;
  stampMat.uniforms.uStampDig.value = dig ? 1.0 : 0.0;
  for (let i = 0; i < filtered.length - 1; i++) {
    const a = filtered[i], b = filtered[i + 1];
    stampMat.uniforms.uPrev.value = rtA.texture;
    stampMat.uniforms.uStampA.value.set(a[0], a[1]);
    stampMat.uniforms.uStampB.value.set(b[0], b[1]);
    stampMat.uniforms.uStampH.value  = dig ? Math.max(0, baseHeights[i] - cfg.depth)
                                           : baseHeights[i] + cfg.H;
    stampMat.uniforms.uStampBase.value = baseHeights[i];
    renderTo(stampMat, rtB); [rtA, rtB] = [rtB, rtA];
  }
  stampMat.uniforms.uStampMode.value = 0;
  stampMat.uniforms.uStampDig.value  = 0.0;
}

const TOWER = { rt: 0.026, rb: 0.05,  H: 8 };
const WALL  = { rt: 0.010, rb: 0.020, H: TOWER.H * (2 / 3) };
const MOAT  = { rt: 0.012, rb: 0.024, depth: TOWER.H * (2 / 3) };

function heightAtUv(u, v) {
  const px = Math.min(GRID - 1, Math.max(0, Math.floor(u * GRID)));
  const py = Math.min(GRID - 1, Math.max(0, Math.floor(v * GRID)));
  try {
    renderer.readRenderTargetPixels(rtA, px, py, 1, 1, readBuf);
    return readBuf[0] * HSCALE;
  } catch (e) { return 0; }
}

function surfaceUvFromPointer(cx, cy) {
  ndc.x = (cx / innerWidth) * 2 - 1;
  ndc.y = -(cy / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  let h = 0, res = null;
  for (let i = 0; i < 3; i++) {
    groundPlane.constant = -h;
    if (!raycaster.ray.intersectPlane(groundPlane, hit)) return null;
    const u = (hit.x + WORLD / 2) / WORLD;
    const v = (WORLD / 2 - hit.z) / WORLD;
    res = [Math.min(1, Math.max(0, u)), Math.min(1, Math.max(0, v))];
    h = heightAtUv(res[0], res[1]);
  }
  return res;
}

renderer.domElement.addEventListener('pointerdown', (ev) => {
  activePointers.add(ev.pointerId);
  if (appMode === 'nav') return;
  if (activePointers.size >= 2) {
    // two-finger: cancel draw, let OrbitControls handle pinch-zoom
    painting = false; wallActive = false; wallPoints = [];
    clearPreview(); return;
  }
  if (ev.button !== 0 || paused) return;
  if (tool === 'tower') {
    const uv = surfaceUvFromPointer(ev.clientX, ev.clientY);
    if (uv) pendingTower = { mode: 1, a: uv, b: uv,
      rt: TOWER.rt, rb: TOWER.rb, h: heightAtUv(uv[0], uv[1]) + TOWER.H };
  } else if (tool === 'wall' || tool === 'fosse') {
    wallActive = true; wallPoints = [{ x: ev.clientX, y: ev.clientY }];
  } else {
    painting = true;
    lastPointer = { x: ev.clientX, y: ev.clientY };
  }
});

addEventListener('pointerup', (ev) => {
  activePointers.delete(ev.pointerId);
  if (wallActive && wallPoints.length >= 2) {
    if (tool === 'fosse') buildPathFromPoints(wallPoints, MOAT, true);
    else                  buildPathFromPoints(wallPoints, WALL, false);
  }
  painting = false; wallActive = false; wallPoints = []; lastPointer = null;
  clearPreview();
});

renderer.domElement.addEventListener('pointermove', (ev) => {
  if (!painting && !wallActive) return;
  if (activePointers.size >= 2) return;
  lastPointer = { x: ev.clientX, y: ev.clientY };
  if (wallActive) {
    const last = wallPoints[wallPoints.length - 1];
    const dx = ev.clientX - last.x, dy = ev.clientY - last.y;
    if (dx*dx + dy*dy > 100) {
      wallPoints.push({ x: ev.clientX, y: ev.clientY });
      drawPreview(wallPoints);
    }
  }
});

renderer.domElement.addEventListener('pointercancel', (ev) => {
  activePointers.delete(ev.pointerId);
  painting = false; wallActive = false; wallPoints = [];
  clearPreview();
});

renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

let brushPow = 0.4, tideRising = false;

function bind(id, fn, fmt = (v) => v.toFixed(2)) {
  const el = $(id), out = $(id + 'V');
  const upd = () => { const v = parseFloat(el.value); if (out) out.textContent = fmt(v); fn(v); };
  el.addEventListener('input', upd); upd();
}
bind('brushSize', (v) => simMat.uniforms.uBrushR.value = v);
bind('brushPow',  (v) => brushPow = v);
bind('repose',    (v) => simMat.uniforms.uRepose.value = v);
bind('tide',      (v) => { tideRising = false; $('tideBtn').classList.remove('on');
                           tideMean = v; }, (v) => v.toFixed(1));
bind('erode',     (v) => simMat.uniforms.uErode.value = v);
bind('wave',      (v) => waveAmp = v, (v) => v.toFixed(1));
bind('cad',       (v) => waveSpeed = v, (v) => v.toFixed(1));

$('tideBtn').addEventListener('click', () => {
  tideRising = !tideRising;
  $('tideBtn').classList.toggle('on', tideRising);
});
$('resetBtn').addEventListener('click', () => {
  simQuad.material = initMat;
  renderer.setRenderTarget(rtA);
  renderer.render(simScene, simCam);
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, 0);
  for (const rt of [fluxA, fluxB]) { renderer.setRenderTarget(rt); renderer.clear(); }
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x0d1418, 1);
  $('tide').value = -1; $('tide').dispatchEvent(new Event('input'));
});
$('pauseBtn').addEventListener('click', () => {
  paused = !paused;
  $('pauseBtn').classList.toggle('on', paused);
  $('pauseBtn').textContent = paused ? STRINGS[lang].btnResume : STRINGS[lang].btnPause;
  painting = false; lastPointer = null;
});

// floating controls
$('langBtn').addEventListener('click', () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  applyLang();
});
$('settingsBtn').addEventListener('click', () => $('ui').classList.toggle('open'));

// zoom: move the camera along its view direction, clamped to min/max distance
function zoomBy(factor) {
  const offset = camera.position.clone().sub(controls.target);
  const dist = Math.max(controls.minDistance, Math.min(controls.maxDistance, offset.length() * factor));
  offset.normalize().multiplyScalar(dist);
  camera.position.copy(controls.target).add(offset);
  controls.update();
}
$('zoomInBtn').addEventListener('click',  () => zoomBy(0.82));
$('zoomOutBtn').addEventListener('click', () => zoomBy(1.22));

// mode buttons
$('navBtn').addEventListener('click', () => setMode('nav'));
$('buildBtn').addEventListener('click', () => setMode('build'));

// tool buttons
function updateToolButtons() {
  $('towerBtn').classList.toggle('on', tool === 'tower');
  $('wallBtn').classList.toggle('on',  tool === 'wall');
  $('fosseBtn').classList.toggle('on', tool === 'fosse');
  $('addBtn').classList.toggle('on',   tool === 'paint');
  $('digBtn').classList.toggle('on',   tool === 'dig');
}
function setTool(t) {
  tool = (tool === t) ? 'paint' : t;
  painting = false; wallActive = false; pendingTower = null;
  updateToolButtons();
}
$('towerBtn').addEventListener('click', () => setTool('tower'));
$('wallBtn').addEventListener('click',  () => setTool('wall'));
$('fosseBtn').addEventListener('click', () => setTool('fosse'));
$('addBtn').addEventListener('click',   () => setTool('paint'));
$('digBtn').addEventListener('click',   () => setTool('dig'));

// init UI state
setMode('nav');
applyLang();

// ---------- main loop ----------
const clock = new THREE.Clock();

function setTideMean(v) {
  tideMean = Math.max(-2, Math.min(18, v));
  $('tide').value = tideMean.toFixed(1); $('tideV').textContent = tideMean.toFixed(1);
}

function frame() {
  const realDt = Math.min(clock.getDelta(), 0.05);
  const dt = paused ? 0.0 : realDt;
  simTime += dt;
  const t = simTime;
  const dtW = Math.min(dt * 60.0, 1.0);
  simMat.uniforms.uDt.value = dt * 60.0;
  fluxMat.uniforms.uDt.value = dtW;
  waterUpMat.uniforms.uDt.value = dtW;

  if (tideRising && !paused) setTideMean(tideMean + dt * 0.6);

  for (const m of [simMat, sandMat, waterMat, waterUpMat]) {
    if (m.uniforms.uTideMean)  m.uniforms.uTideMean.value  = tideMean;
    if (m.uniforms.uWaveAmp)   m.uniforms.uWaveAmp.value   = waveAmp;
    if (m.uniforms.uWaveSpeed) m.uniforms.uWaveSpeed.value = waveSpeed;
    if (m.uniforms.uTime)      m.uniforms.uTime.value      = t;
  }

  if (!paused) {
    if (painting && lastPointer) {
      const uv = surfaceUvFromPointer(lastPointer.x, lastPointer.y);
      if (uv) {
        simMat.uniforms.uBrush.value.set(uv[0], uv[1]);
        simMat.uniforms.uBrushP.value = (tool === 'dig' ? -1 : 1) * brushPow;
      }
    }

    if (pendingTower) {
      const stamp = pendingTower; pendingTower = null;
      simMat.uniforms.uStampMode.value = stamp.mode;
      simMat.uniforms.uStampA.value.set(stamp.a[0], stamp.a[1]);
      simMat.uniforms.uStampB.value.set(stamp.b[0], stamp.b[1]);
      simMat.uniforms.uStampRt.value = stamp.rt;
      simMat.uniforms.uStampRb.value = stamp.rb;
      simMat.uniforms.uStampH.value = stamp.h;
    } else {
      simMat.uniforms.uStampMode.value = 0;
    }

    simMat.uniforms.uPrev.value = rtA.texture;
    simMat.uniforms.uHeight.value = rtA.texture;
    renderTo(simMat, rtB); [rtA, rtB] = [rtB, rtA];
    simMat.uniforms.uBrushP.value = 0;
    simMat.uniforms.uStampMode.value = 0;

    for (let i = 0; i < 4; i++) {
      fluxMat.uniforms.uState.value = rtA.texture;
      fluxMat.uniforms.uFlux.value = fluxA.texture;
      renderTo(fluxMat, fluxB); [fluxA, fluxB] = [fluxB, fluxA];

      waterUpMat.uniforms.uState.value = rtA.texture;
      waterUpMat.uniforms.uFlux.value = fluxA.texture;
      renderTo(waterUpMat, rtB); [rtA, rtB] = [rtB, rtA];
    }
  }

  sandMat.uniforms.uHeight.value = rtA.texture;
  waterMat.uniforms.uHeight.value = rtA.texture;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  previewCanvas.width = innerWidth; previewCanvas.height = innerHeight;
});
</script>
</body>
</html>
