<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jeu d'Artillerie 2D - Effets Spéciaux</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 1000 / 600;
            max-height: 100vh;
        }
        
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #bgCanvas { z-index: 1; }
        #terrainCanvas { z-index: 2; }
        #mainCanvas { z-index: 3; }
        
        #ui {
            position: absolute;
            top: 2%; left: 0; width: 100%;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 4;
            font-size: clamp(12px, 2vw, 20px);
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        .player-info { padding: 5px 10px; border-radius: 5px; }
        #p1Info { color: #ff4444; }
        #p2Info { color: #4444ff; }
        #centerUi { display: flex; flex-direction: column; align-items: center; }
        #timer { color: #ffff44; font-size: clamp(16px, 3vw, 28px); }
        #windInfo { color: #38bdf8; font-size: clamp(10px, 1.5vw, 16px); margin-top: 2px; }
        #bonusInfo { color: #a855f7; font-size: clamp(9px, 1.3vw, 14px); margin-top: 2px; }

        #settingsBtn {
            position: absolute;
            top: 0; right: 0;
            z-index: 5;
            background: #374151;
            border: none;
            color: white;
            padding: 15px 20px;
            font-size: clamp(16px, 2.5vw, 22px);
            border-radius: 0 0 0 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #settingsBtn:hover { background: #4b5563; }

        .mobile-touch-btn {
            position: absolute;
            bottom: 5%;
            z-index: 6;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            width: clamp(54px, 12vw, 90px);
            height: clamp(54px, 12vw, 90px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(22px, 4vw, 36px);
            cursor: pointer;
            touch-action: none;
        }
        #moveLeftBtn { left: 4%; }
        #moveRightBtn { right: 4%; }
        .mobile-touch-btn:active { background: rgba(255, 255, 255, 0.5); }

        .modal-overlay {
            display: none; 
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center; align-items: center;
            z-index: 10;
        }
        #settingsModal { z-index: 11; }

        #modalContent, #settingsContent {
            background: #2e1a47;
            border: 3px solid #ffff00;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            width: 85%; max-width: 350px;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        #settingsContent { text-align: left; background: #1e1b29; }
        #settingsContent h3 { margin-top: 0; color: #ffff00; text-align: center; font-size: 22px; }
        .setting-row { margin-bottom: 14px; display: flex; flex-direction: column; }
        .setting-row label { font-weight: bold; margin-bottom: 4px; font-size: 14px; }
        .setting-inline { flex-direction: row; align-items: center; justify-content: space-between; }
        .setting-inline input[type="checkbox"], #setLang { cursor: pointer; }
        #setLang { background: #374151; color: white; border: 1px solid #ffff00; padding: 4px; border-radius: 4px; }
        .setting-row input[type="range"] { width: 100%; }
        .setting-row span { color: #ffff00; }
        
        .action-btn {
            background: #4d7c0f; color: white; border: none; padding: 12px 20px;
            font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer;
            width: 100%; transition: background 0.2s; margin-top: 10px;
        }
        .action-btn:hover { background: #65a30d; }

        #orientationOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #222;
            z-index: 100;
            justify-content: center; align-items: center;
            text-align: center; font-size: 22px; font-weight: bold;
            color: #ffff00; padding: 30px; box-sizing: border-box;
        }

        @media screen and (orientation: portrait) {
            #orientationOverlay { display: flex; }
            #gameContainer { display: none; }
        }
    </style>
</head>
<body>

<div id="orientationOverlay">🔄 Veuillez tourner votre appareil en mode Paysage pour jouer !</div>

<div id="gameContainer">
    <canvas id="bgCanvas" width="1000" height="600"></canvas>
    <canvas id="terrainCanvas" width="1000" height="600"></canvas>
    <canvas id="mainCanvas" width="1000" height="600"></canvas>
    
    <div id="ui">
        <div id="p1Info" class="player-info">Joueur 1 (Rouge) : 0</div>
        <div id="centerUi">
            <div id="timer">10</div>
            <div id="windInfo">Vent : Calme</div>
            <div id="bonusInfo">Bonus : Aucun</div>
        </div>
        <div id="p2Info" class="player-info">Joueur 2 (Bleu) : 0</div>
    </div>

    <button id="settingsBtn">⚙️</button>

    <div id="moveLeftBtn" class="mobile-touch-btn">◀</div>
    <div id="moveRightBtn" class="mobile-touch-btn">▶</div>

    <div id="modal" class="modal-overlay">
        <div id="modalContent">
            <div id="modalTitle" style="font-size: 26px; color: #ffff00; font-weight: bold;">Titre</div>
            <div id="modalMessage" style="font-size: 18px; margin: 18px 0; line-height: 1.5;">Message...</div>
            <button id="modalBtn" class="action-btn">Continuer</button>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
        <div id="settingsContent">
            <h3 id="menuTitle">Configuration</h3>
            
            <div class="setting-row setting-inline">
                <label id="lblOptBonus" for="setBonus">Activer les bonus :</label>
                <input type="checkbox" id="setBonus" checked>
            </div>
            
            <div class="setting-row">
                <label><span id="lblOptPower">Puissance max du tir :</span> <span id="lblPower">20</span></label>
                <input type="range" id="setPower" min="10" max="20" value="20" step="1">
            </div>
            
            <div class="setting-row setting-inline">
                <label id="lblOptWind" for="setWind">Activer le vent :</label>
                <input type="checkbox" id="setWind" checked>
            </div>
            
            <div class="setting-row">
                <label><span id="lblOptWindPower">Puissance max du vent :</span> <span id="lblWind">5</span></label>
                <input type="range" id="setWindPower" min="0" max="15" value="5" step="1">
            </div>

            <div class="setting-row setting-inline">
                <label id="lblOptBouncing" for="setBouncingSides">Côtés rebondissants :</label>
                <input type="checkbox" id="setBouncingSides">
            </div>

            <div class="setting-row setting-inline">
                <label id="lblOptLang" for="setLang">Langue :</label>
                <select id="setLang">
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                </select>
            </div>
            
            <button id="saveSettingsBtn" class="action-btn">Valider</button>
        </div>
    </div>
</div>

<script>
const width = 1000;
const height = 600;

const bgCanvas = document.getElementById('bgCanvas');
const terrainCanvas = document.getElementById('terrainCanvas');
const mainCanvas = document.getElementById('mainCanvas');

const bgCtx = bgCanvas.getContext('2d');
const terrainCtx = terrainCanvas.getContext('2d');
const ctx = mainCanvas.getContext('2d');

const i18n = {
    fr: {
        menuTitle: "Configuration", optBonus: "Activer les bonus :", optPower: "Puissance max du tir :", optWind: "Activer le vent :", optWindPower: "Puissance max du vent :", optBouncing: "Côtés rebondissants :", optLang: "Langue :", btnValidate: "Valider", btnNextRound: "Manche Suivante", btnNewMatch: "Nouvelle Partie", windDisabled: "Vent : Désactivé", windCalm: "Vent : Calme", windLabel: "Vent : ", bonusLabel: "Bonus : ", bonusNone: "Aucun", bonusTriggered: "Déclenché !", bonusOpt1: "🟢 Tir Multiple (x3)", bonusOpt2: "🔴 Méga Tir (+50%)", bonusOpt3: "🔵 Bouclier (Destructeur)", p1Name: "Joueur 1 (Rouge) : ", p2Name: "Joueur 2 (Bleu) : ", matchOver: "Match Terminé !", matchOverMsg: "Le Joueur {winner} remporte la partie avec 5 points !", hitTitle: "Touché !", hitMsg: "Le Joueur {loser} a été touché !<br><br><strong>+1 point</strong> pour le Joueur {winner}.", orientationNotice: "🔄 Veuillez tourner votre appareil en mode Paysage pour jouer !"
    },
    en: {
        menuTitle: "Settings", optBonus: "Enable bonuses:", optPower: "Max shot power:", optWind: "Enable wind:", optWindPower: "Max wind power:", optBouncing: "Bouncing sides:", optLang: "Language:", btnValidate: "Confirm", btnNextRound: "Next Round", btnNewMatch: "New Game", windDisabled: "Wind: Disabled", windCalm: "Wind: Calm", windLabel: "Wind: ", bonusLabel: "Bonus: ", bonusNone: "None", bonusTriggered: "Triggered!", bonusOpt1: "🟢 Multiple Shot (x3)", bonusOpt2: "🔴 Mega Shot (+50%)", bonusOpt3: "🔵 Shield (Destroyer)", p1Name: "Player 1 (Red): ", p2Name: "Player 2 (Blue): ", matchOver: "Match Over!", matchOverMsg: "Player {winner} wins the match with 5 points!", hitTitle: "Hit!", hitMsg: "Player {loser} was hit!<br><br><strong>+1 point</strong> for Player {winner}.", orientationNotice: "🔄 Please rotate your device to Landscape mode to play!"
    }
};

let gameSettings = {
    bonusEnabled: true,
    maxPower: 20,
    windEnabled: true,
    windSliderValue: 5,
    bouncingSidesEnabled: false,
    lang: "fr"
};

let turn = 1; let roundStarter = 1; let turnTimer = 10;
let keys = {}; let mouse = { x: 0, y: 0 };
const gravity = 0.3; let windValue = 0; let windAcceleration = 0;

let bonus = { x: 500, y: 250, active: true, type: 1, animTime: 0 };
let audioCtx = null;

// Structure du tank adaptée à l'icône (le pivot du canon monte à y - 13, longueur à 22px)
let players = {
    1: { x: 150, y: 0, color: '#ff4444', size: 12, fuel: 100, score: 0, angle: -Math.PI / 4 },
    2: { x: 850, y: 0, color: '#4444ff', size: 12, fuel: 100, score: 0, angle: -3 * Math.PI / 4 }
};
let bullets = []; 
let particles = []; // Gère les flammes et débris d'explosions
let explosionRadius = 35; 
let gameState = 'playing'; 
let nextModalAction = null;

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playShootSound() { initAudio(); if (!audioCtx) return; let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(350, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15); }
function playExplosionSound() { initAudio(); if (!audioCtx) return; let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(320, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.35); gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.35); }
function playBounceSound() { initAudio(); if (!audioCtx) return; let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.12); gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.12); }
function playScoreSound() { initAudio(); if (!audioCtx) return; let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.12); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.35); }
function playBonusSound() { initAudio(); if (!audioCtx) return; let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }

function setMouseFromEvent(clientX, clientY) {
    const rect = mainCanvas.getBoundingClientRect();
    mouse.x = ((clientX - rect.left) / rect.width) * width;
    mouse.y = ((clientY - rect.top) / rect.height) * height;
}

// Générateur d'effets visuels (particules)
function createMuzzleFlame(x, y, angle) {
    for (let i = 0; i < 10; i++) {
        let pAngle = angle + (Math.random() - 0.5) * 0.4;
        let speed = Math.random() * 3 + 2;
        particles.push({
            x: x, y: y,
            vx: Math.cos(pAngle) * speed, vy: Math.sin(pAngle) * speed,
            color: Math.random() > 0.4 ? '#ff9900' : '#ffcc00',
            size: Math.random() * 5 + 3,
            life: Math.floor(Math.random() * 10) + 6,
            maxLife: 16
        });
    }
}

function createVisualExplosion(x, y, scale) {
    for (let i = 0; i < 30; i++) {
        let pAngle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 5 + 1;
        particles.push({
            x: x, y: y,
            vx: Math.cos(pAngle) * speed,
            vy: Math.sin(pAngle) * speed - 1.5, // Éjection vers le haut
            color: Math.random() > 0.6 ? '#6b7280' : (Math.random() > 0.3 ? '#ef4444' : '#f59e0b'),
            size: Math.random() * (7 * scale) + 3,
            life: Math.floor(Math.random() * 20) + 15,
            maxLife: 35
        });
    }
}

function init() {
    let skyGradient = bgCtx.createLinearGradient(0, 0, 0, height);
    skyGradient.addColorStop(0, '#1a0c2e'); skyGradient.addColorStop(1, '#4a2c6d');
    bgCtx.fillStyle = skyGradient; bgCtx.fillRect(0, 0, width, height);

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);
    
    mainCanvas.addEventListener('mousemove', e => setMouseFromEvent(e.clientX, e.clientY));
    mainCanvas.addEventListener('click', shoot);

    mainCanvas.addEventListener('touchstart', e => { if (gameState !== 'playing') return; e.preventDefault(); setMouseFromEvent(e.touches[0].clientX, e.touches[0].clientY); });
    mainCanvas.addEventListener('touchmove', e => { if (gameState !== 'playing') return; e.preventDefault(); setMouseFromEvent(e.touches[0].clientX, e.touches[0].clientY); });
    mainCanvas.addEventListener('touchend', e => { if (gameState !== 'playing') return; e.preventDefault(); shoot(); });

    const bLeft = document.getElementById('moveLeftBtn');
    const bRight = document.getElementById('moveRightBtn');
    bLeft.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; });
    bLeft.addEventListener('touchend', e => { e.preventDefault(); keys['ArrowLeft'] = false; });
    bRight.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; });
    bRight.addEventListener('touchend', e => { e.preventDefault(); keys['ArrowRight'] = false; });

    document.getElementById('modalBtn').addEventListener('click', () => {
        initAudio(); document.getElementById('modal').style.display = 'none';
        if (nextModalAction) nextModalAction();
    });
    document.getElementById('settingsBtn').addEventListener('click', openSettings);
    document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);

    resetMatch();
    requestAnimationFrame(gameLoop);
    setInterval(updateTimer, 1000);
}

function openSettings() {
    if (gameState !== 'playing') return; gameState = 'settings';
    document.getElementById('setBonus').checked = gameSettings.bonusEnabled;
    document.getElementById('setPower').value = gameSettings.maxPower;
    document.getElementById('lblPower').innerText = gameSettings.maxPower;
    document.getElementById('setWind').checked = gameSettings.windEnabled;
    document.getElementById('setWindPower').value = gameSettings.windSliderValue;
    document.getElementById('lblWind').innerText = gameSettings.windSliderValue;
    document.getElementById('setBouncingSides').checked = gameSettings.bouncingSidesEnabled;
    document.getElementById('setLang').value = gameSettings.lang;
    translateSettingsDOM();
    document.getElementById('settingsModal').style.display = 'flex';
}

function translateSettingsDOM() {
    let t = i18n[gameSettings.lang];
    document.getElementById('menuTitle').innerText = t.menuTitle;
    document.getElementById('lblOptBonus').innerText = t.optBonus;
    document.getElementById('lblOptPower').innerText = t.optPower;
    document.getElementById('lblOptWind').innerText = t.optWind;
    document.getElementById('lblOptWindPower').innerText = t.optWindPower;
    document.getElementById('lblOptBouncing').innerText = t.optBouncing;
    document.getElementById('lblOptLang').innerText = t.optLang;
    document.getElementById('saveSettingsBtn').innerText = t.btnValidate;
}

function saveSettings() {
    initAudio();
    gameSettings.bonusEnabled = document.getElementById('setBonus').checked;
    gameSettings.maxPower = parseInt(document.getElementById('setPower').value);
    gameSettings.windEnabled = document.getElementById('setWind').checked;
    gameSettings.windSliderValue = parseInt(document.getElementById('setWindPower').value);
    gameSettings.bouncingSidesEnabled = document.getElementById('setBouncingSides').checked;
    gameSettings.lang = document.getElementById('setLang').value;

    if (!gameSettings.windEnabled) { windValue = 0; windAcceleration = 0; } 
    else { windAcceleration = windValue * (gameSettings.windSliderValue / 1000); }
    if (!gameSettings.bonusEnabled) bonus.active = false; 
    else if (!bonus.active && bullets.length === 0) bonus.active = true;

    updateUI();
    document.getElementById('settingsModal').style.display = 'none';
    gameState = 'playing';
}

function generateTerrain() {
    terrainCtx.clearRect(0, 0, width, height); terrainCtx.fillStyle = '#4d7c0f'; terrainCtx.beginPath(); terrainCtx.moveTo(0, height);
    let baseHeight = 450;
    for (let x = 0; x <= width; x++) { let y = baseHeight + Math.sin(x * 0.01) * 50 + Math.cos(x * 0.03) * 20; terrainCtx.lineTo(x, y); }
    terrainCtx.lineTo(width, height); terrainCtx.fill();
    for (let i = 0; i < 6; i++) {
        let obsX = 200 + Math.random() * 600; let obsY = getGroundHeight(obsX);
        if (Math.random() > 0.5) { terrainCtx.fillStyle = '#78716c'; terrainCtx.beginPath(); terrainCtx.arc(obsX, obsY - 10, 20 + Math.random()*15, 0, Math.PI * 2); terrainCtx.fill(); } 
        else { terrainCtx.fillStyle = '#78350f'; terrainCtx.fillRect(obsX - 5, obsY - 40, 10, 40); terrainCtx.fillStyle = '#15803d'; terrainCtx.beginPath(); terrainCtx.arc(obsX, obsY - 50, 25, 0, Math.PI * 2); terrainCtx.fill(); }
    }
}

function getGroundHeight(x) {
    if (x < 0 || x >= width) return height;
    const imgData = terrainCtx.getImageData(Math.floor(x), 0, 1, height).data;
    for (let y = 0; y < height; y++) { if (imgData[y * 4 + 3] > 0) return y; }
    return height;
}

function updateTimer() { if (gameState === 'playing') { turnTimer--; document.getElementById('timer').innerText = turnTimer; if (turnTimer <= 0) switchTurn(); } }
function generateWind() { if (!gameSettings.windEnabled) { windValue = 0; windAcceleration = 0; } else { windValue = Math.floor((Math.random() - 0.5) * 20); windAcceleration = windValue * (gameSettings.windSliderValue / 1000); } updateUI(); }
function switchTurn() { turn = turn === 1 ? 2 : 1; turnTimer = 10; document.getElementById('timer').innerText = turnTimer; players[turn].fuel = 100; generateWind(); gameState = 'playing'; }

function shoot() {
    if (gameState !== 'playing') return; playShootSound();
    let p = players[turn]; let dx = mouse.x - p.x; let dy = mouse.y - (p.y - 13); let distance = Math.sqrt(dx * dx + dy * dy);
    let maxDistance = gameSettings.maxPower / 0.08; let cappedDistance = Math.min(distance, maxDistance); let power = cappedDistance * 0.08;
    
    let muzzleX = p.x + Math.cos(p.angle) * 22;
    let muzzleY = (p.y - 13) + Math.sin(p.angle) * 22;
    
    // Déclenchement visuel de la flamme au bout du canon
    createMuzzleFlame(muzzleX, muzzleY, p.angle);

    bullets = [{ x: muzzleX, y: muzzleY, vx: Math.cos(p.angle) * power, vy: Math.sin(p.angle) * power, explosionScale: 1.0 }];
    gameState = 'shooting';
}

function triggerModal(title, msg, isMatchOver) {
    gameState = 'modal'; let t = i18n[gameSettings.lang];
    document.getElementById('modalTitle').innerText = title; document.getElementById('modalMessage').innerHTML = msg;
    let btn = document.getElementById('modalBtn');
    if (isMatchOver) { btn.innerText = t.btnNewMatch; nextModalAction = resetMatch; } 
    else { btn.innerText = t.btnNextRound; nextModalAction = () => resetRound(false); }
    document.getElementById('modal').style.display = 'flex';
}

function update() {
    if (gameState === 'playing') { let activeP = players[turn]; activeP.angle = Math.atan2(mouse.y - (activeP.y - 13), mouse.x - activeP.x); }
    
    // Traitement de la physique des particules (flammes/explosions)
    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy;
        pt.vy += 0.04; // Gravité légère sur les résidus
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
    }

    if (gameState !== 'modal' && gameSettings.bonusEnabled && bonus.active) {
        bonus.animTime += 0.035; let minY = 60; let obstacleY = getGroundHeight(bonus.x); let maxY = obstacleY - 20; if (maxY < minY) maxY = minY + 10;
        let midY = (minY + maxY) / 2; let amplitude = (maxY - minY) / 2; bonus.y = midY + Math.sin(bonus.animTime) * amplitude;
    }
    let p = players[turn];
    if (gameState === 'playing' && p.fuel > 0) {
        let speed = 1.5; if (keys['ArrowLeft']) { p.x -= speed; p.fuel -= 2; } if (keys['ArrowRight']) { p.x += speed; p.fuel -= 2; }
        p.x = Math.max(10, Math.min(width - 10, p.x)); p.y = getGroundHeight(p.x);
    }
    if ((gameState === 'shooting' || gameState === 'waiting') && bullets.length > 0) {
        let hitRegistered = false;
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; b.vx += windAcceleration; b.vy += gravity; b.x += b.vx; b.y += b.vy;
            if (b.x < 0) {
                if (gameSettings.bouncingSidesEnabled) { b.vx = -b.vx; b.x = 0; playBounceSound(); } 
                else { if (turn === 1) { b.vx = -b.vx; b.x = 0; playBounceSound(); } else b.x = width; }
            } else if (b.x > width) {
                if (gameSettings.bouncingSidesEnabled) { b.vx = -b.vx; b.x = width; playBounceSound(); } 
                else { if (turn === 2) { b.vx = -b.vx; b.x = width; playBounceSound(); } else b.x = 0; }
            }
            if (b.y < 0 && gameSettings.bouncingSidesEnabled) { b.vy = -b.vy; b.y = 0; playBounceSound(); }
            if (b.y > height) {
                if (gameSettings.bouncingSidesEnabled) { b.vy = -b.vy; b.y = height; playBounceSound(); } 
                else { bullets.splice(i, 1); continue; }
            }
            if (gameSettings.bonusEnabled && bonus.active) {
                let distToBonus = Math.sqrt((b.x - bonus.x) ** 2 + (b.y - bonus.y) ** 2);
                if (distToBonus < 18) {
                    bonus.active = false; playBonusSound(); updateUI();
                    if (bonus.type === 1) {
                        let speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy); let angle = Math.atan2(b.vy, b.vx);
                        bullets.push({ x: b.x, y: b.y, vx: Math.cos(angle - 0.15) * speed * 1.18, vy: Math.sin(angle - 0.15) * speed * 1.18, explosionScale: 0.7 });
                        bullets.push({ x: b.x, y: b.y, vx: Math.cos(angle + 0.15) * speed * 0.82, vy: Math.sin(angle + 0.15) * speed * 0.82, explosionScale: 0.7 });
                        b.explosionScale = 0.7;
                    } else if (bonus.type === 2) { b.explosionScale = 1.5; } else if (bonus.type === 3) { bullets.splice(i, 1); continue; }
                }
            }
            if (b.y >= 0 && b.y < height && b.x >= 0 && b.x < width) {
                let pixel = terrainCtx.getImageData(Math.floor(b.x), Math.floor(b.y), 1, 1).data;
                if (pixel[3] > 0) {
                    playExplosionSound(); 
                    
                    // Déclenchement de l'effet visuel d'explosion
                    createVisualExplosion(b.x, b.y, b.explosionScale);

                    destroyTerrain(b.x, b.y, explosionRadius * b.explosionScale);
                    let hit = checkPlayerHit(b.x, b.y, b.explosionScale); if (hit) hitRegistered = true;
                    bullets.splice(i, 1); continue;
                }
            }
        }
        if (bullets.length === 0 && gameState === 'shooting') { gameState = 'waiting'; if (!hitRegistered) setTimeout(switchTurn, 1000); }
    }
}

function destroyTerrain(x, y, radius) {
    terrainCtx.save(); terrainCtx.globalCompositeOperation = 'destination-out'; terrainCtx.fillStyle = 'rgba(0,0,0,1)'; terrainCtx.beginPath(); terrainCtx.arc(x, y, radius, 0, Math.PI * 2); terrainCtx.fill(); terrainCtx.restore();
    for (let id in players) players[id].y = getGroundHeight(players[id].x);
}

function checkPlayerHit(ex, ey, currentScale) {
    let t = i18n[gameSettings.lang];
    for (let id in players) {
        let p = players[id]; let dist = Math.sqrt((p.x - ex) ** 2 + ((p.y - 6) - ey) ** 2);
        if (dist < (explosionRadius * currentScale) + p.size) {
            let winnerId = (parseInt(id) === 1) ? 2 : 1; players[winnerId].score++; updateUI();
            setTimeout(() => {
                playScoreSound();
                if (players[winnerId].score >= 5) { let text = t.matchOverMsg.replace("{winner}", winnerId); triggerModal(t.matchOver, text, true); } 
                else { let text = t.hitMsg.replace("{loser}", id).replace("{winner}", winnerId); triggerModal(t.hitTitle, text, false); }
            }, 100);
            return true;
        }
    }
    return false;
}

function updateUI() {
    let t = i18n[gameSettings.lang];
    document.getElementById('orientationOverlay').innerText = t.orientationNotice;
    document.getElementById('p1Info').innerText = `${t.p1Name}${players[1].score}`;
    document.getElementById('p2Info').innerText = `${t.p2Name}${players[2].score}`;
    if (!gameSettings.windEnabled) document.getElementById('windInfo').innerText = t.windDisabled;
    else { let wText = t.windCalm; if (windValue > 0) wText = `${t.windLabel}➔ ${windValue}`; if (windValue < 0) wText = `${t.windLabel}⬅ ${Math.abs(windValue)}`; document.getElementById('windInfo').innerText = wText; }
    let bText = t.bonusLabel;
    if (!gameSettings.bonusEnabled) bText += t.windDisabled.split(' ')[2] || "Disabled";
    else if (!bonus.active) bText += t.bonusTriggered;
    else { if (bonus.type === 1) bText += t.bonusOpt1; if (bonus.type === 2) bText += t.bonusOpt2; if (bonus.type === 3) bText += t.bonusOpt3; }
    document.getElementById('bonusInfo').innerText = bText;
}

function drawShieldBonus(ctx, x, y, type) {
    ctx.save(); ctx.translate(x, y);
    if (type === 1) ctx.fillStyle = '#4ade80'; else if (type === 2) ctx.fillStyle = '#f87171'; else if (type === 3) ctx.fillStyle = '#60a5fa';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(8, -10); ctx.quadraticCurveTo(8, 2, 0, 12); ctx.quadraticCurveTo(-8, 2, -8, -10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let symbol = type === 1 ? '3' : (type === 2 ? 'M' : '🛡️'); ctx.fillText(symbol, type === 3 ? -1 : 0, 0); ctx.restore();
}

function resetRound(isNewMatch) {
    generateTerrain();
    players[1].x = Math.max(30, Math.min(350, 150 + Math.floor((Math.random() - 0.5) * 400)));
    players[2].x = Math.max(650, Math.min(width - 30, 850 + Math.floor((Math.random() - 0.5) * 400)));
    players[1].y = getGroundHeight(players[1].x); players[2].y = getGroundHeight(players[2].x);
    players[1].angle = -Math.PI / 4; players[2].angle = -3 * Math.PI / 4; players[1].fuel = 100; players[2].fuel = 100;
    bonus.active = gameSettings.bonusEnabled; bonus.type = Math.floor(Math.random() * 3) + 1; bonus.x = 500; bonus.y = 60; bonus.animTime = 0;
    if (isNewMatch) roundStarter = 1; else roundStarter = (roundStarter === 1) ? 2 : 1;
    bullets = []; particles = []; turn = roundStarter; turnTimer = 10; document.getElementById('timer').innerText = turnTimer; generateWind(); gameState = 'playing';
}

function resetMatch() { players[1].score = 0; players[2].score = 0; resetRound(true); }

function draw() {
    ctx.clearRect(0, 0, width, height);
    if (gameSettings.bonusEnabled && bonus.active) drawShieldBonus(ctx, bonus.x, bonus.y, bonus.type);
    
    // Dessin des joueurs (Modèles de tanks lissés style icône)
    for (let id in players) {
        let p = players[id]; 
        
        // 1. Canon étiré (longueur 22px, pivot à y - 13)
        ctx.save();
        ctx.translate(p.x, p.y - 13);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(0, -3, 22, 6);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(0, -3, 22, 6);
        ctx.restore();

        // 2. Chenilles sombres ovales à la base
        ctx.fillStyle = '#2d3748'; ctx.strokeStyle = '#6b7280'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(p.x - 16, p.y - 5, 32, 6, 3);
        ctx.fill(); ctx.stroke();

        // 3. Châssis profilé trapézoïdal
        ctx.fillStyle = p.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(p.x - 14, p.y - 5); ctx.lineTo(p.x + 14, p.y - 5);
        ctx.lineTo(p.x + 9, p.y - 13); ctx.lineTo(p.x - 9, p.y - 13);
        ctx.closePath();
        ctx.fill(); ctx.stroke();

        // 4. Dôme de la tourelle supérieur
        ctx.beginPath();
        ctx.arc(p.x, p.y - 13, 7, Math.PI, 0);
        ctx.fill(); ctx.stroke();
        
        if (parseInt(id) === turn && gameState === 'playing') {
            ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(p.x, p.y - 7, p.size + 8, 0, Math.PI * 2); ctx.stroke();
        }
    }

    // Ligne de visée mise à l'échelle du nouveau canon
    if (gameState === 'playing') {
        let activePlayer = players[turn]; let dx = mouse.x - activePlayer.x; let dy = mouse.y - (activePlayer.y - 13); let distance = Math.sqrt(dx * dx + dy * dy);
        let maxDistance = gameSettings.maxPower / 0.08; let cappedDistance = Math.min(distance, maxDistance);
        let startX = activePlayer.x + Math.cos(activePlayer.angle) * 22; let startY = (activePlayer.y - 13) + Math.sin(activePlayer.angle) * 22;
        let endX = activePlayer.x + Math.cos(activePlayer.angle) * cappedDistance; let endY = (activePlayer.y - 13) + Math.sin(activePlayer.angle) * cappedDistance;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(endX, endY); ctx.stroke(); ctx.setLineDash([]);
    }

    // Rendu des obus
    if ((gameState === 'shooting' || gameState === 'waiting') && bullets.length > 0) {
        ctx.fillStyle = '#ffffff';
        for (let b of bullets) { ctx.beginPath(); let bRadius = b.explosionScale > 1 ? 6 : (b.explosionScale < 1 ? 3 : 4); ctx.arc(b.x, b.y, bRadius, 0, Math.PI * 2); ctx.fill(); }
    }

    // Rendu dynamique des particules (flammes et explosions)
    for (let pt of particles) {
        ctx.save();
        ctx.globalAlpha = pt.life / pt.maxLife; // Effet de fondu progressif
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
init();
</script>
